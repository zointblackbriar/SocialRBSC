# VELOCITY TEMPLATE ENGINE CONFIGURATION FOR SOCIALRBSC SMART CONTRACT GENERATION

# Input encoding configuration
input.encoding=utf-8

# Resource Loaders - Classpath-first for annotation processing

# Use classpath loader as primary (works during compile/annotation processing)
# Use file loader as fallback (for development/IDE)
resource.loader = classpath, file

# PRIMARY: Classpath Resource Loader (templates from SocialRBSC JAR)
# This loader finds templates packaged in the SocialRBSC-core dependency
class.resource.loader.class = org.apache.velocity.runtime.resource.loader.ClasspathResourceLoader
class.resource.loader.cache = true
class.resource.loader.modificationCheckInterval = 2

# SECONDARY: File Resource Loader (fallback for development)
file.resource.loader.class = org.apache.velocity.runtime.resource.loader.FileResourceLoader
file.resource.loader.path = velocitytemplates
file.resource.loader.cache = true
file.resource.loader.modificationCheckInterval = 2

# VELOCITY INSTANCE INITIALIZATION

# Initialize the Velocity singleton instance
# This must be set to true for proper resource manager initialization
runtime.log.logsystem.class = org.apache.velocity.runtime.log.NullLogChute

# TEMPLATE PATHS FOR ANNOTATION PROCESSING

# Core Role and Compartment Templates
template.role = Role.vm
template.role.one = RoleOne.vm
template.role.generic = RoleGeneric.vm
template.role.creator = RoleCreatorTemplate.vm

template.compartment = Compartment.vm
template.compartment.initiator = CompartmentInitiatorTemplate.vm
template.compartment.activator = CompartmentActivatorRuntime.vm

# Social Agent Templates
template.socialagent = SocialAgentTemplate.vm
template.socialagent.addrole = SocialAgentAddRole.vm
template.socialagent.removerole = SocialAgentRemoveRole.vm
template.socialagent.initiator = SocialAgentInitiator.vm

# Goal-Plan-Tree Templates
template.goalplantree = GoalPlanTree.sol.vm
template.goalplan = GoalPlan.vm

# Component Templates
template.component = ComponentTemplate.vm
template.component.core = ComponentCoreTemplate.vm
template.component.role = ComponentRoleTemplate.vm

# Society Pattern Templates (in contracts subdirectory)
template.society = contracts/societypattern/Society.sol.vm
template.socialagent.contract = contracts/societypattern/SocialAgent.sol.vm

# Utility Templates
template.player = PlayerTemplate.vm
template.reasoning = Reasoning.vm
template.mediator = ConcreteMedaitorTemplate.vm
template.plan.contract = PlanContract.vm
template.meal.plan = MealPlanFull.vm

# SMART CONTRACT GENERATION CONFIGURATION

# Output directory for generated Solidity contracts
output.solidity.dir = generatedsmartcontract/contracts
output.solidity.package = contracts

# Output directory for generated Java wrapper classes
output.java.dir = generatedsmartcontract/javafiles
output.java.package = de.tudresden.delivery.contracts

# Generated code options
generate.solidity = true
generate.javawrappers = true
generate.events = true
generate.modifiers = true
generate.interfaces = true

# Solidity version compatibility
solidity.version = 0.8.19
solidity.evm.version = istanbul

# ANNOTATION PROCESSOR CONFIGURATION

# Enable annotation processing for role/compartment/social agent annotations
annotation.processing.enabled = true

# Process these annotations
annotation.role.enabled = true
annotation.compartment.enabled = true
annotation.socialagent.enabled = true
annotation.society.enabled = true

# Pre-conditions and method guards
annotation.precondition.enabled = true
annotation.precondition.internalparam = internalparam
#class.resource.loader.modificationCheckInterval=1

